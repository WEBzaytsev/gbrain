name: Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
    paths:
      - Dockerfile
      - compose.yaml
      - skills/**
      - data/scripts/**
      - .dockerignore
      - .env.example
      - README.md
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - skills/**
      - data/scripts/**
      - .dockerignore
      - .env.example
      - README.md
      - .github/workflows/docker-image.yml
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to GitHub Container Registry
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: webzaytsev/gbrain
  GBRAIN_REF: f72de97943eb9dc1292a80f85d19db7e311855dc

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n data/scripts/entrypoint.sh \
            data/scripts/init.sh \
            data/scripts/grant-federation.sh \
            data/scripts/harden-brain-repo.sh

      - name: Validate Python helpers
        run: python3 -m py_compile data/scripts/patch-gbrain-admin-ui.py

      - name: Validate Compose render
        run: docker compose --env-file .env.example config --quiet

      - name: Verify required skillpack files
        run: |
          set -euo pipefail
          test -f skills/RESOLVER.md
          find skills -name SKILL.md -print -quit | grep -q .

      - name: Secret-shaped literal guard
        run: |
          set -euo pipefail
          if grep -RInE '(github_pat_|ghp_|github_pat-)[A-Za-z0-9_-]+' \
            Dockerfile compose.yaml .env.example README.md data/scripts .github/workflows; then
            echo 'Secret-shaped literal found in tracked public files.' >&2
            exit 1
          fi

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=GBrain
            org.opencontainers.image.vendor=WebZaytsev

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_image))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_image)) }}
          build-args: |
            GBRAIN_REF=${{ env.GBRAIN_REF }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILDKIT_INLINE_CACHE=1
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
